<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wenitor Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e11d48'/%3E%3Cpath d='M6 10l4 12 6-9 6 9 4-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{'oc-bg':'#0f172a','oc-panel':'#1e293b','oc-accent':'#e11d48','oc-blue':'#38bdf8','oc-border':'#334155'},fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{height:100%;margin:0}
body{background:#0f172a;color:#e2e8f0;font-family:Inter,sans-serif;overflow:hidden}
#app{height:calc(100% - 48px);display:flex;flex-direction:column}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#334155;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.inp{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px;color:#e2e8f0;margin-bottom:10px;outline:none;font-size:14px}
.inp:focus{border-color:#38bdf8}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#e2e8f0;transition:background .15s}
.btn:hover{background:#334155}
.btn-accent{background:#e11d48;border-color:#e11d48;color:#fff}.btn-accent:hover{background:#be123c}
.btn:disabled{opacity:.6;cursor:wait}
.tree-item{display:flex;gap:6px;align-items:center;padding:4px 8px;cursor:pointer;font-size:13px;white-space:nowrap;border-left:2px solid transparent}
.tree-item:hover{background:#273449}
.tree-item.active{background:#273449;border-left-color:#38bdf8}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;cursor:pointer;border-right:1px solid #334155;color:#94a3b8;white-space:nowrap}
.tab.active{background:#0f172a;color:#e2e8f0;box-shadow:inset 0 -2px #e11d48}
.tab .x{opacity:.5;font-size:16px;line-height:1}.tab .x:hover{opacity:1;color:#e11d48}
#line-numbers,#code{font:13px/20px 'JetBrains Mono',monospace;padding-top:12px;padding-bottom:12px;margin:0}
#line-numbers{width:48px;flex:none;text-align:right;padding-right:10px;color:#475569;overflow:hidden;user-select:none;background:#0b1222;white-space:pre}
#code{flex:1;min-width:0;padding-left:12px;white-space:pre;overflow:auto;tab-size:2;outline:none;resize:none;border:0;background:transparent;color:#e2e8f0;caret-color:#38bdf8}
#ctx{position:fixed;z-index:60;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px;min-width:170px;box-shadow:0 12px 30px #0008}
#ctx div{padding:7px 12px;border-radius:6px;font-size:13px;cursor:pointer}
#ctx div:hover{background:#334155}
#toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 14px;border-radius:8px;font-size:13px;background:#1e293b;border:1px solid #334155;border-left:3px solid #38bdf8;max-width:340px}
.toast.err{border-left-color:#e11d48}.toast.ok{border-left-color:#22c55e}
.hidden{display:none!important}
</style>
</head>
<body>
<header id="hdr" class="h-12 flex items-center justify-between px-4 bg-oc-panel border-b border-oc-border"></header>
<main id="app"></main>
<div id="modal"></div>
<div id="ctx" class="hidden"></div>
<div id="toasts"></div>
<input type="file" id="imgInput" accept="image/*" multiple class="hidden">

<script>
/* ================= AYARLAR ================= */
const SUPABASE_URL="https://enyfgaebodgvhfobczfl.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVueWZnYWVib2Rndmhmb2JjemZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTM0NzEsImV4cCI6MjEwNjc4OTQ3MX0.PkYloo0P1OTYsTVzbffoVLx938UtO06An3JTF4L2kfo";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const sb=supabaseClient;

/* ================= YARDIMCILAR ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=()=>Math.random().toString(36).slice(2,8);
const slugify=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9-_]+/g,'-').replace(/^-+|-+$/g,'')||'site-'+rand();
const within=(k,p)=>k===p||k.startsWith(p+'/');
const LOGO='<svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#e11d48"/><path d="M6 10l4 12 6-9 6 9 4-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let user=null;try{user=JSON.parse(localStorage.getItem('wen_user')||'null')}catch{}
let S=null,chan=null;

function toast(m,t='info'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4500)}
function modal(html){$('#modal').innerHTML=`<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onmousedown="if(event.target===this)closeModal()"><div class="bg-oc-panel border border-oc-border rounded-xl p-6 w-full max-w-md shadow-2xl max-h-full overflow-auto">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
async function sha(p,e){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e.toLowerCase()+':'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function cleanup(){if(chan){sb.removeChannel(chan);chan=null}if(S)clearTimeout(S.pt);S=null;closeModal();hideCtx()}

/* ================= ÜST MENÜ ================= */
function header(){
  $('#hdr').innerHTML=`<a href="#/" class="flex items-center gap-2">${LOGO}<span class="font-bold tracking-tight">Wenitor <span class="text-oc-accent">Studio</span></span></a>
  <nav class="flex items-center gap-2">
    <a href="#/projects" class="btn">Projeler</a>
    ${user?`<span class="text-sm text-slate-400 hidden sm:inline">@${esc(user.username)}</span><button class="btn" onclick="logout()">Çıkış yap</button>`:`<button class="btn" onclick="openAuth('login')">Giriş yap</button><button class="btn btn-accent" onclick="openAuth('register')">Kayıt ol</button>`}
  </nav>`;
}

/* ================= KİMLİK DOĞRULAMA ================= */
function openAuth(mode='login'){
  const reg=mode==='register';
  modal(`<h2 class="text-xl font-bold mb-4">${reg?'Hesap oluştur':'Giriş yap'}</h2>
  ${reg?'<input id="a-u" class="inp" placeholder="Kullanıcı adı" autocomplete="username">':''}
  <input id="a-e" type="email" class="inp" placeholder="E-posta" autocomplete="email">
  <input id="a-p" type="password" class="inp" placeholder="Şifre" autocomplete="${reg?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')submitAuth('${mode}')">
  <div id="a-err" class="text-sm text-oc-accent mb-2 hidden"></div>
  <button id="a-go" class="btn btn-accent w-full justify-center" onclick="submitAuth('${mode}')">${reg?'Kayıt ol':'Giriş yap'}</button>
  <p class="text-sm text-slate-400 mt-4 text-center">${reg?'Zaten hesabın var mı?':'Hesabın yok mu?'} <a href="#" class="text-oc-blue" onclick="openAuth('${reg?'login':'register'}');return false">${reg?'Giriş yap':'Kayıt ol'}</a></p>`);
  setTimeout(()=>$(reg?'#a-u':'#a-e')?.focus(),50);
}
async function submitAuth(mode){
  const err=m=>{const e=$('#a-err');e.textContent=m;e.classList.remove('hidden')};
  const email=$('#a-e').value.trim().toLowerCase(),pw=$('#a-p').value,un=$('#a-u')?.value.trim();
  if(!email||!pw)return err('E-posta ve şifre gerekli.');
  if(mode==='register'&&(!un||un.length<3))return err('Kullanıcı adı en az 3 karakter olmalı.');
  if(pw.length<6)return err('Şifre en az 6 karakter olmalı.');
  const btn=$('#a-go');btn.disabled=true;
  try{
    const password_hash=await sha(pw,email);
    if(mode==='register'){
      const {error}=await supabaseClient.from('app_users').insert([{email,username:un,password_hash}]);
      if(error){btn.disabled=false;return err(error.code==='23505'?'Bu e-posta veya kullanıcı adı zaten kayıtlı.':error.message)}
      user={email,username:un};
    }else{
      const {data,error}=await supabaseClient.from('app_users').select('*').eq('email',email).eq('password_hash',password_hash);
      if(error){btn.disabled=false;return err(error.message)}
      if(!data||!data.length){btn.disabled=false;return err('E-posta veya şifre hatalı.')}
      user={email:data[0].email,username:data[0].username};
    }
    localStorage.setItem('wen_user',JSON.stringify(user));
    closeModal();header();toast('Hoş geldin, '+user.username,'ok');
    if(location.hash.startsWith('#/projects'))route();
  }catch(e){btn.disabled=false;err('Hata: '+e.message)}
}
function logout(){user=null;localStorage.removeItem('wen_user');header();toast('Çıkış yapıldı.');route()}

/* ================= YÖNLENDİRME ================= */
function route(){
  cleanup();header();
  const [p,slug]=location.hash.replace(/^#\/?/,'').split('/');
  if(p==='newsite'||p==='newrepomn')return openEditor(slug);
  if(p==='live')return openLive(slug);
  if(p==='projects')return renderProjects();
  renderWelcome();
}
window.addEventListener('hashchange',route);
window.addEventListener('load',route);

/* ================= KARŞILAMA ================= */
function renderWelcome(){
  const feats=[['⚡','Anında önizleme','HTML, CSS, JS ve resimler yazdıkça sağ panelde birleşir.'],['📡','Canlı yayın','Deploy ettiğin site, Supabase Realtime ile ziyaretçilerde anında güncellenir.'],['🔒','Dosya kilidi','Kritik dosyaları salt-okunur yap, yanlışlıkla bozulmasın.'],['🖼️','Resim desteği','Bilgisayarından resim yükle, Base64 olarak projeye gömülsün.']];
  $('#app').innerHTML=`<div class="flex-1 overflow-auto"><div class="max-w-5xl mx-auto px-6 py-16">
    <div class="flex items-center gap-3 mb-8">${LOGO}<span class="text-slate-400 text-sm">Wenitor Inc.</span></div>
    <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight leading-tight max-w-3xl">Tarayıcıda kodla, tek tıkla yayınla.</h1>
    <p class="text-slate-400 mt-5 max-w-xl text-lg">Wenitor Studio'ya hoş geldin. Dosyalarını düzenle, önizle ve canlı bir bağlantıyla paylaş.</p>
    <div class="flex flex-wrap gap-3 mt-8">
      <button class="btn btn-accent text-base px-5 py-3" onclick="location.hash='#/newsite/site-${rand()}'">Yeni proje başlat</button>
      <button class="btn text-base px-5 py-3" onclick="location.hash='#/projects'">Projelerimi aç</button>
    </div>
    <div class="grid sm:grid-cols-2 gap-4 mt-14">
      ${feats.map(f=>`<div class="bg-oc-panel border border-oc-border rounded-xl p-5"><div class="text-2xl mb-2">${f[0]}</div><div class="font-semibold">${f[1]}</div><div class="text-sm text-slate-400 mt-1">${f[2]}</div></div>`).join('')}
    </div>
    <p class="text-xs text-slate-500 mt-12">© ${new Date().getFullYear()} Wenitor Inc.</p>
  </div></div>`;
}

/* ================= PROJELER (GALERİ) ================= */
async function renderProjects(){
  $('#app').innerHTML=`<div class="flex-1 overflow-auto"><div class="max-w-6xl mx-auto p-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6"><h1 class="text-2xl font-bold">Projeler</h1>
    <div class="flex gap-2"><input id="q" class="inp !mb-0 !w-56" placeholder="Ara…" oninput="drawList()"><button class="btn btn-accent" onclick="location.hash='#/newsite/site-${rand()}'">Yeni proje</button></div></div>
    <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"><div class="text-slate-400">Yükleniyor…</div></div></div></div>`;
  const load=async()=>{
    const {data,error}=await supabaseClient.from('deployed_sites').select('project_slug,title,description,user_email,is_private,license,updated_at').order('updated_at',{ascending:false});
    if(error){toast('Projeler alınamadı: '+error.message,'err');return}
    window._list=data||[];drawList();
  };
  await load();
  chan=supabaseClient.channel('public:deployed_sites').on('postgres_changes',{event:'*',schema:'public',table:'deployed_sites'},()=>load()).subscribe();
}
function drawList(){
  const g=$('#grid');if(!g)return;
  const q=($('#q')?.value||'').toLowerCase();
  const l=(window._list||[]).filter(s=>(!s.is_private||(user&&s.user_email===user.email))&&(s.project_slug+' '+(s.title||'')+' '+(s.description||'')).toLowerCase().includes(q));
  if(!l.length){g.innerHTML='<div class="text-slate-400">Henüz proje yok. "Yeni proje" ile başla.</div>';return}
  g.innerHTML=l.map(s=>{const own=user&&s.user_email===user.email;return `<div class="bg-oc-panel border border-oc-border rounded-xl p-5 flex flex-col">
    <div class="flex items-start justify-between gap-2"><div class="font-semibold truncate">${esc(s.title||s.project_slug)}</div>${s.is_private?'<span title="Özel">🔒</span>':''}</div>
    <div class="text-xs text-oc-blue mono mt-1">/${esc(s.project_slug)}</div>
    <p class="text-sm text-slate-400 mt-2 flex-1">${esc(s.description||'Açıklama yok.')}</p>
    <div class="text-xs text-slate-500 mt-3">${esc(s.license||'')} · ${new Date(s.updated_at).toLocaleString('tr-TR')}${own?' · senin':''}</div>
    <div class="flex gap-2 mt-4"><a class="btn" href="#/live/${esc(s.project_slug)}">Canlı aç</a><a class="btn" href="#/newsite/${esc(s.project_slug)}">Düzenle</a>${own?`<button class="btn" onclick="delSite('${esc(s.project_slug)}')">Sil</button>`:''}</div></div>`}).join('');
}
async function delSite(slug){
  if(!user||!confirm(`"${slug}" kalıcı olarak silinsin mi?`))return;
  const {error}=await supabaseClient.from('deployed_sites').delete().eq('project_slug',slug).eq('user_email',user.email);
  if(error)toast(error.message,'err');else toast('Proje silindi.','ok');
}

/* ================= CANLI GÖRÜNTÜLEYİCİ ================= */
async function openLive(slug){
  slug=slugify(slug);
  $('#app').innerHTML=`<div class="h-9 flex items-center justify-between px-3 bg-oc-panel border-b border-oc-border text-sm">
    <div class="flex items-center gap-2"><span id="rt-dot" class="w-2 h-2 rounded-full bg-yellow-400"></span><span id="lt" class="font-medium">${esc(slug)}</span></div>
    <a class="text-oc-blue" href="#/newsite/${esc(slug)}">Düzenle</a></div>
    <iframe id="lv" class="flex-1 w-full bg-white border-0" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>`;
  const canSee=d=>!d.is_private||(user&&user.email===d.user_email);
  const draw=d=>{$('#lt').textContent=d.title||d.project_slug;$('#lv').srcdoc=buildPreview(d.files||{})};
  const {data,error}=await supabaseClient.from('deployed_sites').select('*').order('updated_at',{ascending:false}).eq('project_slug',slug).maybeSingle();
  if(error)return toast(error.message,'err');
  if(!data){$('#lv').srcdoc='<body style="font-family:sans-serif;padding:2rem">Bu adreste yayınlanmış bir site yok.</body>';}
  else if(!canSee(data)){$('#lv').srcdoc='<body style="font-family:sans-serif;padding:2rem">Bu proje özel.</body>';}
  else draw(data);
  subscribeSite(slug,p=>{if(p.new&&p.new.files&&canSee(p.new)){draw(p.new);toast('Site güncellendi.','ok')}});
}

/* ================= REALTIME ================= */
function subscribeSite(slug,cb){
  chan=supabaseClient.channel('public:deployed_sites:'+slug)
    .on('postgres_changes',{event:'*',schema:'public',table:'deployed_sites',filter:'project_slug=eq.'+slug},cb)
    .subscribe(st=>{const d=$('#rt-dot');if(d)d.className='w-2 h-2 rounded-full '+(st==='SUBSCRIBED'?'bg-green-400':'bg-yellow-400')});
}

/* ================= WEB IDE ================= */
const TPL=()=>({
 'index.html':{content:`<!DOCTYPE html>\n<html lang="tr">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>Sitem</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Merhaba Dünya 👋</h1>\n  <p>Wenitor Studio ile oluşturuldu.</p>\n  <button id="btn">Tıkla</button>\n  <script src="script.js"><\/script>\n</body>\n</html>`},
 'style.css':{content:`body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}\nbutton{background:#e11d48;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:16px;cursor:pointer}`},
 'script.js':{content:`let n=0;\ndocument.getElementById('btn').addEventListener('click',()=>{\n  n++;\n  document.getElementById('btn').textContent='Tıklama: '+n;\n});`}
});
const EDITOR_HTML=`
<div class="h-10 flex items-center justify-between gap-2 px-3 bg-oc-panel border-b border-oc-border text-sm">
  <div class="flex items-center gap-2 min-w-0"><span id="rt-dot" class="w-2 h-2 rounded-full bg-yellow-400 flex-none" title="Realtime"></span><span id="slugLbl" class="mono text-oc-blue truncate"></span><span id="dirty" class="text-slate-500 hidden">• kaydedilmedi</span></div>
  <div class="flex gap-2"><button class="btn !py-1" onclick="copyLink()">Bağlantıyı kopyala</button><button class="btn btn-accent !py-1" onclick="quickDeploy()">Deploy</button></div>
</div>
<div class="flex flex-1 min-h-0 flex-col md:flex-row">
  <aside class="w-full md:w-60 max-h-40 md:max-h-none flex-none bg-oc-panel border-r border-oc-border flex flex-col">
    <div class="flex items-center justify-between px-3 py-2 border-b border-oc-border"><span class="text-xs font-semibold text-slate-400">Dosyalar</span>
      <div class="flex gap-1"><button class="btn !p-1 !px-2" title="Yeni dosya" onclick="addFile()">📄+</button><button class="btn !p-1 !px-2" title="Yeni klasör" onclick="addFolder()">📁+</button><button class="btn !p-1 !px-2" title="Resim yükle" onclick="$('#imgInput').click()">🖼️+</button></div></div>
    <div id="tree" class="flex-1 overflow-auto py-1"></div>
  </aside>
  <section class="flex-1 flex flex-col min-w-0 min-h-0">
    <div id="tabs" class="flex overflow-x-auto bg-oc-panel border-b border-oc-border flex-none"></div>
    <div class="relative flex-1 flex min-h-0 bg-oc-bg">
      <div id="ph" class="m-auto text-slate-500 text-sm">Düzenlemek için soldan bir dosya seç.</div>
      <div id="codewrap" class="flex flex-1 min-w-0 min-h-0 hidden"><div id="line-numbers">1</div><textarea id="code" spellcheck="false" wrap="off"></textarea></div>
      <div id="imgview" class="hidden flex-1 overflow-auto p-6 text-center"><img class="max-w-full mx-auto rounded-lg border border-oc-border bg-[repeating-conic-gradient(#1e293b_0%_25%,#0f172a_0%_50%)] bg-[length:16px_16px]"><div id="imgInfo" class="text-xs text-slate-400 mt-3"></div></div>
      <div id="lock" class="hidden absolute inset-0 pointer-events-none" style="background:rgba(15,23,42,.35)"><div class="pointer-events-auto absolute top-3 right-5 flex items-center gap-3 bg-oc-panel border border-oc-border rounded-lg px-3 py-2 text-sm shadow-xl">🔒 Kilitli · salt okunur<button class="btn !py-1" onclick="toggleLock(S.active)">Kilidi aç</button></div></div>
    </div>
  </section>
  <section class="w-full md:w-1/2 flex flex-col min-h-0 border-t md:border-t-0 md:border-l border-oc-border flex-1 md:flex-none">
    <div class="h-9 flex items-center justify-between px-3 bg-oc-panel border-b border-oc-border text-sm flex-none"><span class="text-slate-400">Önizleme</span>
      <div class="flex gap-2"><button class="btn !py-0.5" onclick="refreshPreview()">Yenile</button><button class="btn !py-0.5" onclick="openPreviewTab()">Yeni sekmede aç</button></div></div>
    <iframe id="preview" class="flex-1 w-full bg-white border-0" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </section>
</div>`;

function openEditor(slug){
  if(!slug){location.replace('#/newsite/site-'+rand());return}
  slug=slugify(slug);
  S={slug,files:TPL(),open:['index.html'],active:'index.html',editorId:null,title:slug,description:'',isPrivate:false,license:'MIT',owner:null,lastUpdated:null,collapsed:new Set(),dirty:false,pt:null,ctx:null};
  try{const d=localStorage.getItem('wen_draft_'+slug);if(d)S.files=JSON.parse(d)}catch{}
  $('#app').innerHTML=EDITOR_HTML;
  $('#slugLbl').textContent='/'+slug;
  bindEditor();renderAll();
  loadRemote(slug);
  subscribeSite(slug,p=>{
    const r=p.new;if(!S||!r||!r.updated_at||r.updated_at===S.lastUpdated)return;
    if(r.is_private&&(!user||user.email!==r.user_email))return;
    if(confirm('Proje başka bir oturumda güncellendi. Son sürüm yüklensin mi? (Kaydedilmemiş değişiklikler kaybolur)'))applyRow(r);else S.lastUpdated=r.updated_at;
  });
}
async function loadRemote(slug){
  const {data,error}=await supabaseClient.from('deployed_sites').select('*').order('updated_at',{ascending:false}).eq('project_slug',slug).maybeSingle();
  if(!S||S.slug!==slug)return;
  if(error)return toast('Sunucu hatası: '+error.message,'err');
  if(!data)return;
  if(data.is_private&&(!user||user.email!==data.user_email)){toast('Bu proje özel.','err');location.hash='#/projects';return}
  applyRow(data);
  if(data.user_email&&(!user||user.email!==data.user_email))toast('Bu proje sana ait değil. Deploy için farklı bir adres seç.');
}
function applyRow(d){
  S.files=d.files||{};S.editorId=d.editor_id;S.title=d.title||S.slug;S.description=d.description||'';S.isPrivate=!!d.is_private;S.license=d.license||'MIT';S.owner=d.user_email;S.lastUpdated=d.updated_at;S.dirty=false;
  const ks=Object.keys(S.files).filter(k=>!S.files[k].folder);
  S.open=S.open.filter(k=>S.files[k]);
  if(!S.open.length&&ks.length)S.open=[ks.includes('index.html')?'index.html':ks[0]];
  if(!S.files[S.active])S.active=S.open[0]||null;
  localStorage.removeItem('wen_draft_'+S.slug);
  renderAll();
}
function bindEditor(){
  const ta=$('#code');
  ta.addEventListener('input',()=>{const f=S.files[S.active];if(!f||f.locked)return;f.content=ta.value;updateLines();changed()});
  ta.addEventListener('scroll',()=>{$('#line-numbers').scrollTop=ta.scrollTop});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'&&!ta.readOnly){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}
  });
  $('#tree').addEventListener('click',e=>{
    const it=e.target.closest('.tree-item');if(!it)return;const p=it.dataset.p;
    if(it.dataset.f==='1'){S.collapsed.has(p)?S.collapsed.delete(p):S.collapsed.add(p);renderTree()}else openTab(p);
  });
  $('#tree').addEventListener('contextmenu',e=>{const it=e.target.closest('.tree-item');if(!it)return;e.preventDefault();showCtx(e.clientX,e.clientY,it.dataset.p)});
  $('#tabs').addEventListener('click',e=>{
    const x=e.target.closest('[data-x]');if(x){closeTab(x.dataset.x);return}
    const t=e.target.closest('[data-t]');if(t)openTab(t.dataset.t);
  });
}
function renderAll(){renderTree();renderTabs();renderEditor();refreshPreview();updateDirty()}
const ico=n=>({html:'🌐',css:'🎨',js:'⚡',json:'📋',svg:'🖼️',md:'📝'}[n.split('.').pop().toLowerCase()]||'📄');
function renderTree(){
  const keys=Object.keys(S.files),folders=new Set(keys.filter(k=>S.files[k].folder));
  keys.forEach(k=>{const p=k.split('/');for(let i=1;i<p.length;i++)folders.add(p.slice(0,i).join('/'))});
  const rows=[...new Set([...keys,...folders])].sort((a,b)=>a.localeCompare(b));
  $('#tree').innerHTML=rows.filter(k=>![...S.collapsed].some(c=>k.startsWith(c+'/'))).map(k=>{
    const d=k.split('/').length-1,n=k.split('/').pop(),f=S.files[k]||{},fo=folders.has(k);
    const locked=fo?Object.keys(S.files).filter(x=>x.startsWith(k+'/')&&!S.files[x].folder).some(x=>S.files[x].locked):f.locked;
    return `<div class="tree-item ${k===S.active?'active':''}" data-p="${esc(k)}" data-f="${fo?1:0}" style="padding-left:${8+d*14}px">${fo?(S.collapsed.has(k)?'▸ 📁':'▾ 📂'):(f.isImage?'🖼️':ico(n))}<span class="truncate">${esc(n)}</span>${locked?'<span class="ml-auto">🔒</span>':''}</div>`;
  }).join('')||'<div class="p-3 text-xs text-slate-500">Dosya yok.</div>';
}
function renderTabs(){
  $('#tabs').innerHTML=S.open.map(k=>`<div class="tab ${k===S.active?'active':''}" data-t="${esc(k)}">${S.files[k]?.isImage?'🖼️':ico(k)} ${esc(k.split('/').pop())}${S.files[k]?.locked?' 🔒':''}<span class="x" data-x="${esc(k)}">×</span></div>`).join('');
}
function renderEditor(){
  const f=S.files[S.active],has=f&&!f.folder,txt=has&&!f.isImage,ta=$('#code');
  $('#ph').classList.toggle('hidden',!!has);
  $('#codewrap').classList.toggle('hidden',!txt);
  $('#imgview').classList.toggle('hidden',!(has&&f.isImage));
  $('#lock').classList.toggle('hidden',!(has&&f.locked));
  if(has&&f.isImage){$('#imgview img').src=f.content;$('#imgInfo').textContent=S.active+' · '+Math.round(f.content.length*0.75/1024)+' KB'}
  if(txt){ta.value=f.content||'';ta.readOnly=!!f.locked;updateLines()}
}
function updateLines(){
  const ta=$('#code'),n=ta.value.split('\n').length,ln=$('#line-numbers');
  ln.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');ln.scrollTop=ta.scrollTop;
}
function updateDirty(){const d=$('#dirty');if(d)d.classList.toggle('hidden',!S.dirty)}
function changed(){
  S.dirty=true;updateDirty();
  try{localStorage.setItem('wen_draft_'+S.slug,JSON.stringify(S.files))}catch{}
  clearTimeout(S.pt);S.pt=setTimeout(refreshPreview,400);
}
function openTab(p){
  if(!S.files[p]||S.files[p].folder)return;
  if(!S.open.includes(p))S.open.push(p);
  S.active=p;renderTree();renderTabs();renderEditor();
}
function closeTab(p){
  const i=S.open.indexOf(p);S.open=S.open.filter(k=>k!==p);
  if(S.active===p)S.active=S.open[Math.min(i,S.open.length-1)]||null;
  renderTree();renderTabs();renderEditor();
}

/* --- Dosya işlemleri --- */
function ensureParents(p){const a=p.split('/');for(let i=1;i<a.length;i++){const d=a.slice(0,i).join('/');if(!S.files[d])S.files[d]={folder:true}}}
function addFile(){
  const n=prompt('Dosya yolu (örn. js/app.js):','yeni.html');if(!n)return;
  const p=n.trim().replace(/^\/+/,'');if(!p)return;
  if(S.files[p])return toast('Bu dosya zaten var.','err');
  ensureParents(p);S.files[p]={content:''};changed();openTab(p);renderTree();
}
function addFolder(){
  const n=prompt('Klasör adı:','klasor');if(!n)return;
  const p=n.trim().replace(/^\/+|\/+$/g,'');if(!p)return;
  if(S.files[p])return toast('Bu ad zaten var.','err');
  ensureParents(p);S.files[p]={folder:true};changed();renderTree();
}
$('#imgInput').addEventListener('change',e=>{
  if(!S)return;
  [...e.target.files].forEach(f=>{
    if(!f.type.startsWith('image/'))return;
    if(f.size>2*1024*1024)toast(f.name+' büyük (>2 MB). Proje boyutu artabilir.');
    const r=new FileReader();
    r.onload=()=>{let n='img/'+f.name.replace(/\s+/g,'-');if(S.files[n])n='img/'+rand()+'-'+f.name.replace(/\s+/g,'-');
      ensureParents(n);S.files[n]={content:r.result,isImage:true};changed();openTab(n);renderTree()};
    r.readAsDataURL(f);
  });
  e.target.value='';
});
function renamePath(p){
  const base=p.split('/').pop(),dir=p.includes('/')?p.slice(0,p.lastIndexOf('/')+1):'';
  const n=prompt('Yeni ad:',base);if(!n||n===base)return;
  const np=dir+n.trim().replace(/^\/+/,'');
  if(Object.keys(S.files).filter(k=>within(k,p)).some(k=>S.files[k].locked))return toast('Kilitli öğeler yeniden adlandırılamaz.','err');
  if(Object.keys(S.files).some(k=>within(k,np)))return toast('Bu ad zaten var.','err');
  const nf={};for(const k in S.files)nf[within(k,p)?np+k.slice(p.length):k]=S.files[k];
  S.files=nf;ensureParents(np);
  S.open=S.open.map(m=>within(m,p)?np+m.slice(p.length):m);
  if(S.active&&within(S.active,p))S.active=np+S.active.slice(p.length);
  changed();renderAll();
}
function copyPath(p){
  const m=p.match(/^(.*?)(\.[^./]*)?$/);let np=(m[1]||p)+'-copy'+(m[2]||'');
  if(Object.keys(S.files).some(k=>within(k,np)))np=(m[1]||p)+'-copy-'+rand()+(m[2]||'');
  Object.keys(S.files).filter(k=>within(k,p)).forEach(k=>{S.files[np+k.slice(p.length)]={...S.files[k],locked:false}});
  ensureParents(np);changed();renderTree();toast('Kopyalandı: '+np.split('/').pop(),'ok');
}
function toggleLock(p){
  const ks=Object.keys(S.files).filter(k=>within(k,p)&&!S.files[k].folder);if(!ks.length)return;
  const lock=!ks.every(k=>S.files[k].locked);
  ks.forEach(k=>S.files[k].locked=lock);changed();renderAll();
}
function deletePath(p){
  const ks=Object.keys(S.files).filter(k=>within(k,p));
  if(ks.some(k=>S.files[k].locked))return toast('Önce kilidi aç.','err');
  if(!confirm(`"${p}" silinsin mi?`))return;
  ks.forEach(k=>delete S.files[k]);
  S.open=S.open.filter(m=>!within(m,p));
  if(S.active&&within(S.active,p))S.active=S.open[0]||null;
  changed();renderAll();
}

/* --- Sağ tık menüsü --- */
function showCtx(x,y,p){
  S.ctx=p;
  const ks=Object.keys(S.files).filter(k=>within(k,p)&&!S.files[k].folder);
  const locked=ks.length&&ks.every(k=>S.files[k].locked);
  const c=$('#ctx');
  c.innerHTML=`<div onclick="ctxAct('copy')">📋 Kopyala</div><div onclick="ctxAct('rename')">✏️ Yeniden adlandır</div><div onclick="ctxAct('lock')">${locked?'🔓 Kilidi aç':'🔒 Kilitle'}</div><div onclick="ctxAct('del')" style="color:#fb7185">🗑️ Sil</div>`;
  c.classList.remove('hidden');
  c.style.left=Math.min(x,innerWidth-190)+'px';c.style.top=Math.min(y,innerHeight-170)+'px';
}
function hideCtx(){$('#ctx').classList.add('hidden')}
function ctxAct(a){const p=S&&S.ctx;hideCtx();if(!p)return;({copy:copyPath,rename:renamePath,lock:toggleLock,del:deletePath})[a](p)}
document.addEventListener('click',hideCtx);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){hideCtx();closeModal()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&S){e.preventDefault();quickDeploy()}
});
window.addEventListener('scroll',hideCtx,true);

/* --- Önizleme --- */
function buildPreview(files){
  const entry=files['index.html']||Object.values(files).find((f,i)=>!f.folder&&Object.keys(files)[i].endsWith('.html'));
  if(!entry)return '<body style="font-family:sans-serif;background:#0f172a;color:#94a3b8;padding:2rem">index.html bulunamadı.</body>';
  const get=ref=>files[ref.split('?')[0].split('#')[0].replace(/^(\.\/|\/)+/,'')];
  let html=entry.content||'';
  html=html.replace(/<link\b[^>]*>/gi,m=>{const h=m.match(/href=["']([^"']+)["']/i);const f=h&&get(h[1]);return f&&!f.isImage&&/stylesheet/i.test(m)?`<style>${f.content}</style>`:m});
  html=html.replace(/<script\b([^>]*?)\ssrc=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,(m,a,s,b)=>{const f=get(s);return f&&!f.isImage?`<script${a}${b}>${(f.content||'').replace(/<\/script/gi,'<\\/script')}<\/script>`:m});
  const img=(m,pre,src,post)=>{const f=get(src);return f&&f.isImage?pre+f.content+post:m};
  html=html.replace(/(<(?:img|source|video|audio|image)\b[^>]*?\ssrc=["'])([^"']+)(["'])/gi,img);
  html=html.replace(/(url\(["']?)([^"')]+)(["']?\))/gi,img);
  return html;
}
function refreshPreview(){if(S&&$('#preview'))$('#preview').srcdoc=buildPreview(S.files)}
function openPreviewTab(){window.open(URL.createObjectURL(new Blob([buildPreview(S.files)],{type:'text/html'})),'_blank')}
function copyLink(){
  const u=location.href.split('#')[0]+'#/live/'+S.slug;
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Canlı bağlantı kopyalandı.','ok'),()=>prompt('Bağlantı:',u));
}

/* --- Deploy --- */
function quickDeploy(){
  if(!user)return openAuth('login');
  if(S.editorId&&S.owner===user.email)return publish({slug:S.slug,title:S.title,description:S.description,license:S.license,isPrivate:S.isPrivate});
  openDeploy();
}
function openDeploy(){
  if(!user)return openAuth('login');
  const foreign=S.owner&&S.owner!==user.email;
  modal(`<h2 class="text-xl font-bold mb-4">Projeyi yayınla</h2>
  <label class="text-xs text-slate-400">Adres (slug)</label><input id="d-slug" class="inp" value="${esc(foreign?S.slug+'-'+rand():S.slug)}">
  <label class="text-xs text-slate-400">Başlık</label><input id="d-title" class="inp" value="${esc(S.title)}">
  <label class="text-xs text-slate-400">Açıklama</label><textarea id="d-desc" class="inp" rows="2">${esc(S.description)}</textarea>
  <label class="text-xs text-slate-400">Lisans</label>
  <select id="d-lic" class="inp">${['MIT','Apache-2.0','GPL-3.0','CC-BY-4.0','Tüm hakları saklıdır'].map(l=>`<option ${l===S.license?'selected':''}>${l}</option>`).join('')}</select>
  <label class="flex items-center gap-2 text-sm mb-4"><input id="d-priv" type="checkbox" ${S.isPrivate?'checked':''}> Özel proje (galeride sadece ben göreyim)</label>
  <div class="flex justify-end gap-2"><button class="btn" onclick="closeModal()">Vazgeç</button><button id="d-go" class="btn btn-accent" onclick="doPublish()">Yayınla</button></div>`);
}
function doPublish(){
  publish({slug:slugify($('#d-slug').value),title:$('#d-title').value.trim(),description:$('#d-desc').value.trim(),license:$('#d-lic').value,isPrivate:$('#d-priv').checked},true);
}
async function publish(m,fromModal){
  const btn=$('#d-go');if(btn){btn.disabled=true;btn.textContent='Yayınlanıyor…'}
  try{
    const {data:ex,error:e1}=await supabaseClient.from('deployed_sites').select('editor_id,user_email').eq('project_slug',m.slug).maybeSingle();
    if(e1)throw e1;
    if(ex&&ex.user_email&&ex.user_email!==user.email)throw new Error('Bu adres başka bir kullanıcıya ait.');
    const now=new Date().toISOString();
    const payload={project_slug:m.slug,editor_id:ex?ex.editor_id:'ed_'+crypto.randomUUID(),title:m.title||m.slug,description:m.description||'',files:S.files,user_email:user.email,is_private:m.isPrivate,license:m.license,updated_at:now};
    const oldSlug=S.slug;
    S.lastUpdated=now;
    const {error}=await supabaseClient.from('deployed_sites').upsert(payload,{onConflict:'project_slug'});
    if(error)throw error;
    localStorage.removeItem('wen_draft_'+oldSlug);
    closeModal();
    toast('Yayınlandı: #/live/'+m.slug,'ok');
    if(m.slug!==oldSlug){location.hash='#/newsite/'+m.slug;return}
    Object.assign(S,{editorId:payload.editor_id,title:payload.title,description:payload.description,license:m.license,isPrivate:m.isPrivate,owner:user.email,dirty:false});
    updateDirty();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Yayınla'}
    toast('Yayınlanamadı: '+(e.message||e),'err');
  }
}
</script>
</body>
