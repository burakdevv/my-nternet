<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e11d48'/%3E%3Cpath d='M6 10l4 12 6-9 6 9 4-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
html,body{height:100%;margin:0}
body{background:#0f172a;color:#e2e8f0;font-family:Inter,sans-serif;overflow:hidden}
#app{height:calc(100% - 48px);display:flex;flex-direction:column}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#334155;border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.inp{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px;color:#e2e8f0;margin-bottom:10px;outline:none;font-size:14px}
.inp:focus{border-color:#38bdf8}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#e2e8f0;transition:background .15s}
.btn:hover{background:#334155}
.btn-accent{background:#e11d48;border-color:#e11d48;color:#fff}.btn-accent:hover{background:#be123c}
.btn:disabled{opacity:.6;cursor:wait}
.tree-item{display:flex;gap:6px;align-items:center;padding:4px 8px;cursor:pointer;font-size:13px;white-space:nowrap;border-left:2px solid transparent}
.tree-item:hover{background:#273449}
.tree-item.active{background:#273449;border-left-color:#38bdf8}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;cursor:pointer;border-right:1px solid #334155;color:#94a3b8;white-space:nowrap}
.tab.active{background:#0f172a;color:#e2e8f0;box-shadow:inset 0 -2px #e11d48}
.tab .x{opacity:.5;font-size:16px;line-height:1}.tab .x:hover{opacity:1;color:#e11d48}
#line-numbers,#code{font:13px/20px 'JetBrains Mono',monospace;padding-top:12px;padding-bottom:12px;margin:0}
#line-numbers{width:48px;flex:none;text-align:right;padding-right:10px;color:#475569;overflow:hidden;user-select:none;background:#0b1222;white-space:pre}
#code{flex:1;min-width:0;padding-left:12px;white-space:pre;overflow:auto;tab-size:2;outline:none;resize:none;border:0;background:transparent;color:#e2e8f0;caret-color:#38bdf8}
#ctx{position:fixed;z-index:60;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:4px;min-width:170px;box-shadow:0 12px 30px #0008}
#ctx div{padding:7px 12px;border-radius:6px;font-size:13px;cursor:pointer}
#ctx div:hover{background:#334155}
#toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 14px;border-radius:8px;font-size:13px;background:#1e293b;border:1px solid #334155;border-left:3px solid #38bdf8;max-width:340px}
.toast.err{border-left-color:#e11d48}.toast.ok{border-left-color:#22c55e}
.hidden{display:none!important}
#intro{position:fixed;inset:0;z-index:100;background:#0f172a;display:grid;place-items:center;transition:opacity .6s,transform .6s}
#intro.out{opacity:0;transform:scale(1.03);pointer-events:none}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(#1e293b 1px,transparent 1px),linear-gradient(90deg,#1e293b 1px,transparent 1px);background-size:40px 40px;animation:pan 8s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 75%);mask-image:radial-gradient(circle,#000 20%,transparent 75%)}
@keyframes pan{to{background-position:40px 40px}}
.intro-in{position:relative;max-width:660px;padding:24px}
.intro-in h1{font-size:clamp(28px,6vw,52px);font-weight:800;line-height:1.1;letter-spacing:-.03em;margin:18px 0}
.w,.rise{opacity:0;animation:rise .6s forwards}.w{display:inline-block}
.r1{animation-delay:1.5s}.r2{animation-delay:2s}.r3{animation-delay:2.4s}.r4{animation-delay:2.8s}.r5{animation-delay:3.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo-pop{width:26px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.steps{margin:14px 0 22px;padding-left:20px;color:#94a3b8;line-height:1.9}
#pz{border:1px dashed #334155;border-radius:10px;padding:8px;margin-bottom:10px;cursor:crosshair;touch-action:none}
#pz.ok{border-color:#22c55e}
#pzc{width:100%;height:90px;background:#0b1222;border-radius:6px;display:block}
#pzbw{height:4px;background:#0f172a;border-radius:4px;margin-top:6px}#pzb{height:100%;width:0;background:#38bdf8;border-radius:4px;transition:width .1s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>

<header id="hdr" class="h-12 flex items-center justify-between px-4 bg-oc-panel border-b border-oc-border"></header>

<div id="ctx" class="hidden"></div>
<div id="toasts"></div>

<script>
/* ================= AYARLAR ================= */
const SUPABASE_URL="https://enyfgaebodgvhfobczfl.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVueWZnYWVib2Rndmhmb2JjemZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTM0NzEsImV4cCI6MjEwNjc4OTQ3MX0.PkYloo0P1OTYsTVzbffoVLx938UtO06An3JTF4L2kfo";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const sb=supabaseClient;

/* ================= YARDIMCILAR ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=()=>Math.random().toString(36).slice(2,8);
const slugify=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9-_]+/g,'-').replace(/^-+|-+$/g,'')||'site-'+rand();
const within=(k,p)=>k===p||k.startsWith(p+'/');
const LOGO='<svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#e11d48"/><path d="M6 10l4 12 6-9 6 9 4-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let user=null;try{user=JSON.parse(localStorage.getItem('wen_user')||'null')}catch{}
let S=null,chan=null;

function toast(m,t='info'){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4500)}
function modal(html){$('#modal').innerHTML=`<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4" onmousedown="if(event.target===this)closeModal()"><div class="bg-oc-panel border border-oc-border rounded-xl p-6 w-full max-w-md shadow-2xl max-h-full overflow-auto">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
async function sha(p,e){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e.toLowerCase()+':'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function cleanup(){if(chan){sb.removeChannel(chan);chan=null}if(S)clearTimeout(S.pt);S=null;closeModal();hideCtx()}

/* ================= ÜST MENÜ ================= */
function header(){
  $('#hdr').innerHTML=`<a href="#/" class="flex items-center gap-2">${LOGO}<span class="font-bold tracking-tight">Wenitor <span class="text-oc-accent">Studio</span></span></a>
  <nav class="flex items-center gap-2">
    <a href="#/repos" class="btn">Repolar</a><a href="#/projects" class="btn">Projeler</a>
    ${user?`<span class="text-sm text-slate-400 hidden sm:inline">@${esc(user.username)}</span><button class="btn" onclick="logout()">Çıkış yap</button>`:`<button class="btn" onclick="openAuth('login')">Giriş yap</button><button class="btn btn-accent" onclick="openAuth('register')">Kayıt ol</button>`}
  </nav>`;
}

/* ================= KİMLİK DOĞRULAMA ================= */
async function logout(){user=null;localStorage.removeItem('wen_user');header();toast('Çıkış yapıldı.');route()}

/* ================= YÖNLENDİRME ================= */
function route(){
  cleanup();header();
  const [p,slug]=location.hash.replace(/^#\/?/,'').split('/');
  if(p==='newsite'||p==='newrepomn')return openEditor(slug);
  if(p==='live')return openLive(slug);
  if(p==='projects')return renderProjects();
  if(p==='repos')return renderRepos();
  if(p==='repo')return renderRepo(slug);
  if(p==='test')return openTest(slug,location.hash.replace(/^#\/?/,'').split('/')[2]);
  if(p==='postrage')return openSql(location.hash.split('/').pop());
  renderWelcome();
}
window.addEventListener('hashchange',route);
window.addEventListener('load',()=>{route();showIntro()});

/* ================= KARŞILAMA ================= */

/* ================= PROJELER (GALERİ) ================= */
async function renderProjects(){
  $('#app').innerHTML=`<div class="flex-1 overflow-auto"><div class="max-w-6xl mx-auto p-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6"><h1 class="text-2xl font-bold">Projeler</h1>
    <div class="flex gap-2"><input id="q" class="inp !mb-0 !w-56" placeholder="Ara…" oninput="drawList()"><button class="btn btn-accent" onclick="location.hash='#/newsite/site-${rand()}'">Yeni proje</button></div></div>
    <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"><div class="text-slate-400">Yükleniyor…</div></div></div></div>`;
  const load=async()=>{
    const {data,error}=await supabaseClient.from('deployed_sites').select('project_slug,title,description,user_email,is_private,license,updated_at').order('updated_at',{ascending:false});
    if(error){toast('Projeler alınamadı: '+error.message,'err');return}
    window._list=data||[];drawList();
  };
  await load();
  chan=supabaseClient.channel('public:deployed_sites').on('postgres_changes',{event:'*',schema:'public',table:'deployed_sites'},()=>load()).subscribe();
}
function drawList(){
  const g=$('#grid');if(!g)return;
  const q=($('#q')?.value||'').toLowerCase();
  const l=(window._list||[]).filter(s=>(!s.is_private||(user&&s.user_email===user.email))&&(s.project_slug+' '+(s.title||'')+' '+(s.description||'')).toLowerCase().includes(q));
  if(!l.length){g.innerHTML='<div class="text-slate-400">Henüz proje yok. "Yeni proje" ile başla.</div>';return}
  g.innerHTML=l.map(s=>{const own=user&&s.user_email===user.email;return `<div class="bg-oc-panel border border-oc-border rounded-xl p-5 flex flex-col">
    <div class="flex items-start justify-between gap-2"><div class="font-semibold truncate">${esc(s.title||s.project_slug)}</div>${s.is_private?'<span title="Özel">🔒</span>':''}</div>
    <div class="text-xs text-oc-blue mono mt-1">/${esc(s.project_slug)}</div>
    <p class="text-sm text-slate-400 mt-2 flex-1">${esc(s.description||'Açıklama yok.')}</p>
    <div class="text-xs text-slate-500 mt-3">${esc(s.license||'')} · ${new Date(s.updated_at).toLocaleString('tr-TR')}${own?' · senin':''}</div>
    <div class="flex gap-2 mt-4"><a class="btn" href="#/live/${esc(s.project_slug)}">Canlı aç</a><a class="btn" href="#/newsite/${esc(s.project_slug)}">Düzenle</a>${own?`<button class="btn" onclick="delSite('${esc(s.project_slug)}')">Sil</button>`:''}</div></div>`}).join('');
}
async function delSite(slug){
  if(!user||!confirm(`"${slug}" kalıcı olarak silinsin mi?`))return;
  const {error}=await supabaseClient.from('deployed_sites').delete().eq('project_slug',slug).eq('user_email',user.email);
  if(error)toast(error.message,'err');else toast('Proje silindi.','ok');
}

/* ================= CANLI GÖRÜNTÜLEYİCİ ================= */
async function openLive(slug){
  slug=slugify(slug);
  $('#app').innerHTML=`<div class="h-9 flex items-center justify-between px-3 bg-oc-panel border-b border-oc-border text-sm">
    <div class="flex items-center gap-2"><span id="rt-dot" class="w-2 h-2 rounded-full bg-yellow-400"></span><span id="lt" class="font-medium">${esc(slug)}</span></div>
    <a class="text-oc-blue" href="#/newsite/${esc(slug)}">Düzenle</a></div>
    <iframe id="lv" class="flex-1 w-full bg-white border-0" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>`;
  const canSee=d=>!d.is_private||(user&&user.email===d.user_email);
  const draw=d=>{$('#lt').textContent=d.title||d.project_slug;$('#lv').srcdoc=buildPreview(d.files||{})};
  const {data,error}=await supabaseClient.from('deployed_sites').select('*').order('updated_at',{ascending:false}).eq('project_slug',slug).maybeSingle();
  if(error)return toast(error.message,'err');
  if(!data){$('#lv').srcdoc='<body style="font-family:sans-serif;padding:2rem">Bu adreste yayınlanmış bir site yok.</body>';}
  else if(!canSee(data)){$('#lv').srcdoc='<body style="font-family:sans-serif;padding:2rem">Bu proje özel.</body>';}
  else draw(data);
  subscribeSite(slug,p=>{if(p.new&&p.new.files&&canSee(p.new)){draw(p.new);toast('Site güncellendi.','ok')}});
}

/* ================= REALTIME ================= */
function subscribeSite(slug,cb){
  chan=supabaseClient.channel('public:deployed_sites:'+slug)
    .on('postgres_changes',{event:'*',schema:'public',table:'deployed_sites',filter:'project_slug=eq.'+slug},cb)
    .subscribe(st=>{const d=$('#rt-dot');if(d)d.className='w-2 h-2 rounded-full '+(st==='SUBSCRIBED'?'bg-green-400':'bg-yellow-400')});
}

/* ================= WEB IDE ================= */
const TPL=()=>({
 'index.html':{content:`<!DOCTYPE html>\n<html lang="tr">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>Sitem</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Merhaba Dünya 👋</h1>\n  <p>Wenitor Studio ile oluşturuldu.</p>\n  <button id="btn">Tıkla</button>\n  <script src="script.js"><\/script>\n</body>\n</html>`},
 'style.css':{content:`body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}\nbutton{background:#e11d48;color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:16px;cursor:pointer}`},
 'script.js':{content:`let n=0;\ndocument.getElementById('btn').addEventListener('click',()=>{\n  n++;\n  document.getElementById('btn').textContent='Tıklama: '+n;\n});`}
});
const EDITOR_HTML=`
<div class="h-10 flex items-center justify-between gap-2 px-3 bg-oc-panel border-b border-oc-border text-sm">
  <div class="flex items-center gap-2 min-w-0"><span id="rt-dot" class="w-2 h-2 rounded-full bg-yellow-400 flex-none" title="Realtime"></span><span id="slugLbl" class="mono text-oc-blue truncate"></span><span id="dirty" class="text-slate-500 hidden">• kaydedilmedi</span></div>
  <div class="flex gap-2"><button class="btn !py-1" onclick="copyLink()">Bağlantıyı kopyala</button><button class="btn btn-accent !py-1" onclick="quickDeploy()">Deploy</button></div>
</div>
<div class="flex flex-1 min-h-0 flex-col md:flex-row">
  <aside class="w-full md:w-60 max-h-40 md:max-h-none flex-none bg-oc-panel border-r border-oc-border flex flex-col">
    <div class="flex items-center justify-between px-3 py-2 border-b border-oc-border"><span class="text-xs font-semibold text-slate-400">Dosyalar</span>
      <div class="flex gap-1"><button class="btn !p-1 !px-2" title="Yeni dosya" onclick="addFile()">📄+</button><button class="btn !p-1 !px-2" title="Yeni klasör" onclick="addFolder()">📁+</button><button class="btn !p-1 !px-2" title="Resim yükle" onclick="$('#imgInput').click()">🖼️+</button></div></div>
    <div id="tree" class="flex-1 overflow-auto py-1"></div>
  </aside>
  <section class="flex-1 flex flex-col min-w-0 min-h-0">
    <div id="tabs" class="flex overflow-x-auto bg-oc-panel border-b border-oc-border flex-none"></div>
    <div class="relative flex-1 flex min-h-0 bg-oc-bg">
      <div id="ph" class="m-auto text-slate-500 text-sm">Düzenlemek için soldan bir dosya seç.</div>
      <div id="codewrap" class="flex flex-1 min-w-0 min-h-0 hidden"><div id="line-numbers">1</div><textarea id="code" spellcheck="false" wrap="off"></textarea></div>
      <div id="imgview" class="hidden flex-1 overflow-auto p-6 text-center"><img class="max-w-full mx-auto rounded-lg border border-oc-border bg-[repeating-conic-gradient(#1e293b_0%_25%,#0f172a_0%_50%)] bg-[length:16px_16px]"><div id="imgInfo" class="text-xs text-slate-400 mt-3"></div></div>
      <div id="lock" class="hidden absolute inset-0 pointer-events-none" style="background:rgba(15,23,42,.35)"><div class="pointer-events-auto absolute top-3 right-5 flex items-center gap-3 bg-oc-panel border border-oc-border rounded-lg px-3 py-2 text-sm shadow-xl">🔒 Kilitli · salt okunur<button class="btn !py-1" onclick="toggleLock(S.active)">Kilidi aç</button></div></div>
    </div>
  </section>
  <section class="w-full md:w-1/2 flex flex-col min-h-0 border-t md:border-t-0 md:border-l border-oc-border flex-1 md:flex-none">
    <div class="h-9 flex items-center justify-between px-3 bg-oc-panel border-b border-oc-border text-sm flex-none"><span class="text-slate-400">Önizleme</span>
      <div class="flex gap-2"><button class="btn !py-0.5" onclick="refreshPreview()">Yenile</button><button class="btn !py-0.5" onclick="openPreviewTab()">Yeni sekmede aç</button></div></div>
    <iframe id="preview" class="flex-1 w-full bg-white border-0" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </section>
</div>`;

function openEditor(slug){
  if(!slug){location.replace('#/newsite/site-'+rand());return}
  slug=slugify(slug);
  S={slug,files:TPL(),open:['index.html'],active:'index.html',editorId:null,title:slug,description:'',isPrivate:false,license:'MIT',owner:null,lastUpdated:null,collapsed:new Set(),dirty:false,pt:null,ctx:null};
  try{const d=localStorage.getItem('wen_draft_'+slug);if(d)S.files=JSON.parse(d)}catch{}
  $('#app').innerHTML=EDITOR_HTML;
  $('#slugLbl').textContent='/'+slug;
  bindEditor();renderAll();
  loadRemote(slug);
  subscribeSite(slug,p=>{
    const r=p.new;if(!S||!r||!r.updated_at||r.updated_at===S.lastUpdated)return;
    if(r.is_private&&(!user||user.email!==r.user_email))return;
    if(confirm('Proje başka bir oturumda güncellendi. Son sürüm yüklensin mi? (Kaydedilmemiş değişiklikler kaybolur)'))applyRow(r);else S.lastUpdated=r.updated_at;
  });
}
async function loadRemote(slug){
  const {data,error}=await supabaseClient.from('deployed_sites').select('*').order('updated_at',{ascending:false}).eq('project_slug',slug).maybeSingle();
  if(!S||S.slug!==slug)return;
  if(error)return toast('Sunucu hatası: '+error.message,'err');
  if(!data)return;
  if(data.is_private&&(!user||user.email!==data.user_email)){toast('Bu proje özel.','err');location.hash='#/projects';return}
  applyRow(data);
  if(data.user_email&&(!user||user.email!==data.user_email))toast('Bu proje sana ait değil. Deploy için farklı bir adres seç.');
}
function applyRow(d){
  S.files=d.files||{};S.editorId=d.editor_id;S.title=d.title||S.slug;S.description=d.description||'';S.isPrivate=!!d.is_private;S.license=d.license||'MIT';S.owner=d.user_email;S.lastUpdated=d.updated_at;S.dirty=false;
  const ks=Object.keys(S.files).filter(k=>!S.files[k].folder);
  S.open=S.open.filter(k=>S.files[k]);
  if(!S.open.length&&ks.length)S.open=[ks.includes('index.html')?'index.html':ks[0]];
  if(!S.files[S.active])S.active=S.open[0]||null;
  localStorage.removeItem('wen_draft_'+S.slug);
  renderAll();
}
function bindEditor(){
  const ta=$('#code');
  ta.addEventListener('input',()=>{const f=S.files[S.active];if(!f||f.locked)return;f.content=ta.value;updateLines();changed()});
  ta.addEventListener('scroll',()=>{$('#line-numbers').scrollTop=ta.scrollTop});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'&&!ta.readOnly){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}
  });
  $('#tree').addEventListener('click',e=>{
    const it=e.target.closest('.tree-item');if(!it)return;const p=it.dataset.p;
    if(it.dataset.f==='1'){S.collapsed.has(p)?S.collapsed.delete(p):S.collapsed.add(p);renderTree()}else openTab(p);
  });
  $('#tree').addEventListener('contextmenu',e=>{const it=e.target.closest('.tree-item');if(!it)return;e.preventDefault();showCtx(e.clientX,e.clientY,it.dataset.p)});

function buildPreview(files){
  const entry=files['index.html']||Object.values(files).find((f,i)=>!f.folder&&Object.keys(files)[i].endsWith('.html'));
  if(!entry)return '<body style="font-family:sans-serif;background:#0f172a;color:#94a3b8;padding:2rem">index.html bulunamadı.</body>';
  const get=ref=>files[ref.split('?')[0].split('#')[0].replace(/^(\.\/|\/)+/,'')];
  let html=entry.content||'';
  html=html.replace(/<link\b[^>]*>/gi,m=>{const h=m.match(/href=["']([^"']+)["']/i);const f=h&&get(h[1]);return f&&!f.isImage&&/stylesheet/i.test(m)?`<style>${f.content}</style>`:m});
  html=html.replace(/<script\b([^>]*?)\ssrc=["']([^"']+)["']([^>]*)>\s*<\/script>/gi,(m,a,s,b)=>{const f=get(s);return f&&!f.isImage?`<script${a}${b}>${(f.content||'').replace(/<\/script/gi,'<\\/script')}<\/script>`:m});
  const img=(m,pre,src,post)=>{const f=get(src);return f&&f.isImage?pre+f.content+post:m};
  html=html.replace(/(<(?:img|source|video|audio|image)\b[^>]*?\ssrc=["'])([^"']+)(["'])/gi,img);
  html=html.replace(/(url\(["']?)([^"')]+)(["']?\))/gi,img);
  return html;
}

/* ---------- PECHTP: fare hareketi + tarayıcı kimliği ---------- */
const PE={pts:[],t0:0,ok:false,busy:false,token:null,device:null};
async function fingerprint(){
  const c=document.createElement('canvas');c.width=220;c.height=40;const x=c.getContext('2d');
  x.textBaseline='top';x.font='16px Arial';x.fillStyle='#e11d48';x.fillRect(5,5,90,25);x.fillStyle='#38bdf8';x.fillText('Wenitor PECHTP ✓',8,8);
  let gl='';try{const g=document.createElement('canvas').getContext('webgl'),e=g.getExtension('WEBGL_debug_renderer_info');gl=e?g.getParameter(e.UNMASKED_RENDERER_WEBGL):''}catch{}
  const raw=[navigator.userAgent,(navigator.languages||[]).join(),navigator.platform,navigator.hardwareConcurrency,navigator.deviceMemory,screen.width,screen.height,screen.colorDepth,devicePixelRatio,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.maxTouchPoints,c.toDataURL(),gl].join('|');
  return sha(raw,'pechtp');
}
function entropy(p){
  const sp=[],an=[];
  for(let i=1;i<p.length;i++){const dx=p[i][0]-p[i-1][0],dy=p[i][1]-p[i-1][1],dt=Math.max(1,p[i][2]-p[i-1][2]);sp.push(Math.hypot(dx,dy)/dt);an.push(Math.atan2(dy,dx))}
  const m=sp.reduce((a,b)=>a+b,0)/sp.length||1e-9,sd=Math.sqrt(sp.reduce((a,b)=>a+(b-m)**2,0)/sp.length);
  let t=0;for(let i=1;i<an.length;i++)if(Math.abs(an[i]-an[i-1])>.15)t++;
  return Math.min(1,(sd/m)*.4+(t/Math.max(1,an.length))*.8);
}
async function pechtpInit(){
  Object.assign(PE,{pts:[],ok:false,busy:false,token:null});
  PE.device=await fingerprint();
  const z=$('#pz');if(!z)return;
  const cv=$('#pzc'),cx=cv.getContext('2d');
  $('#pzs').innerHTML='Cihaz ID: <span class="mono text-oc-blue">'+PE.device.slice(0,12)+'…</span> · fareyi kutuda doğal biçimde gezdir';
  z.onpointermove=e=>{
    if(PE.ok||PE.busy)return;
    const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,t=performance.now();
    if(!PE.pts.length)PE.t0=t;PE.pts.push([x,y,t]);
    cx.fillStyle='#38bdf8';cx.fillRect(x*cv.width/r.width-1,y*cv.height/r.height-1,3,3);
    const prog=Math.min(1,PE.pts.length/40,(t-PE.t0)/1800);$('#pzb').style.width=(prog*100)+'%';
    if(prog>=1)pechtpVerify();
  };
}
async function pechtpVerify(){
  PE.busy=true;const st=$('#pzs');st.textContent='Doğrulanıyor…';
  try{
    const {data:id,error:e1}=await supabaseClient.rpc('pechtp_begin',{p_device:PE.device});if(e1)throw e1;
    const p=PE.pts,dur=Math.round(p[p.length-1][2]-PE.t0);
    const {data:ok,error:e2}=await supabaseClient.rpc('pechtp_verify',{p_id:id,p_device:PE.device,p_points:p.length,p_duration_ms:dur,p_entropy:+entropy(p).toFixed(3),p_webdriver:!!navigator.webdriver});if(e2)throw e2;
    if(!ok){PE.busy=false;PE.pts=[];$('#pzb').style.width='0';$('#pzc').getContext('2d').clearRect(0,0,999,999);st.textContent='Doğrulanamadı. Fareyi eğrilerle, farklı hızlarda hareket ettir.';return}
    PE.ok=true;PE.token=id;st.innerHTML='✓ İnsan doğrulandı · Cihaz ID: <span class="mono text-oc-blue">'+PE.device.slice(0,12)+'…</span>';
    $('#pz').classList.add('ok');$('#a-go').disabled=false;
  }catch(e){PE.busy=false;st.textContent='Hata: '+(e.message||e)}
}

  <input id="a-p" type="password" class="inp" placeholder="Şifre" autocomplete="${reg?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')submitAuth('${mode}')">
  ${reg?'<div id="pz"><canvas id="pzc" width="400" height="90"></canvas><div id="pzbw"><div id="pzb"></div></div><div id="pzs" class="text-xs text-slate-400 mt-2">Cihaz kimliği hesaplanıyor…</div></div>':''}
  <div id="a-err" class="text-sm text-oc-accent mb-2 hidden"></div>
  <button id="a-go" class="btn btn-accent w-full justify-center" ${reg?'disabled':''} onclick="submitAuth('${mode}')">${reg?'Kayıt ol':'Giriş yap'}</button>
  <p class="text-sm text-slate-400 mt-4 text-center">${reg?'Zaten hesabın var mı?':'Hesabın yok mu?'} <a href="#" class="text-oc-blue" onclick="openAuth('${reg?'login':'register'}');return false">${reg?'Giriş yap':'Kayıt ol'}</a></p>`);
  if(reg)pechtpInit();
  setTimeout(()=>$(reg?'#a-u':'#a-e')?.focus(),50);
}
async function submitAuth(mode){
  const err=m=>{const e=$('#a-err');e.textContent=m;e.classList.remove('hidden')};
  const email=$('#a-e').value.trim().toLowerCase(),pw=$('#a-p').value,un=$('#a-u')?.value.trim();
  if(!email||!pw)return err('E-posta ve şifre gerekli.');
  if(pw.length<6)return err('Şifre en az 6 karakter olmalı.');
  if(mode==='register'){if(!un||un.length<3)return err('Kullanıcı adı en az 3 karakter olmalı.');if(!PE.ok)return err('Önce PECHTP insan doğrulamasını tamamla.')}
  const btn=$('#a-go');btn.disabled=true;
  try{
    const h=await sha(pw,email);
    if(mode==='register'){
      const {error}=await supabaseClient.from('app_users').insert([{email,username:un,password_hash:h,device_id:PE.device,pechtp_token:PE.token}]);
      if(error){btn.disabled=false;return err(error.code==='23505'?'Bu e-posta veya kullanıcı adı zaten kayıtlı.':error.message)}
      user={email,username:un,h};
    }else{
      const {data,error}=await supabaseClient.rpc('app_login',{p_email:email,p_hash:h});
      if(error){btn.disabled=false;return err(error.message)}
      if(!data||!data.length){btn.disabled=false;return err('E-posta veya şifre hatalı.')}
      user={email:data[0].email,username:data[0].username,h};
    }
    localStorage.setItem('wen_user',JSON.stringify(user));
    closeModal();header();toast('Hoş geldin, '+user.username,'ok');route();
  }catch(e){btn.disabled=false;err('Hata: '+e.message)}
}

/* ---------- Repolar ---------- */
async function createRepo(){
  if(!user||!user.h)return openAuth('login');
  const n=prompt('Repo adı:','benim-repom');if(!n)return;
  const slug=slugify(n)+'-'+rand();
  const {error}=await supabaseClient.from('repos').insert([{repo_slug:slug,owner_email:user.email,title:n,items:[]}]);
  if(error)return toast(error.message,'err');
  location.hash='#/repo/'+slug;
}
async function renderRepos(){
  if(!need())return;
  const {data,error}=await supabaseClient.from('repos').select('repo_slug,title,items,updated_at').eq('owner_email',user.email).order('updated_at',{ascending:false});
  if(error)return nf(error.message);
  $('#app').innerHTML=`<div class="flex-1 overflow-auto"><div class="max-w-4xl mx-auto p-6"><div class="flex items-center justify-between mb-6"><h1 class="text-2xl font-bold">Repolarım</h1><button class="btn btn-accent" onclick="createRepo()">Yeni repo</button></div>
  ${data.length?data.map(r=>`<a href="#/repo/${esc(r.repo_slug)}" class="block bg-oc-panel border border-oc-border rounded-xl p-4 mb-3 hover:bg-[#273449]"><div class="font-semibold">${esc(r.title)}</div><div class="text-xs text-slate-400 mt-1">${r.items.length} sınıf · ${new Date(r.updated_at).toLocaleString('tr-TR')}</div></a>`).join(''):'<div class="text-slate-400">Henüz repo yok. "Yeni repo" ile başla.</div>'}</div></div>`;
}
async function renderRepo(slug){
  if(!need())return;
  const {data,error}=await supabaseClient.from('repos').select('*').eq('repo_slug',slug).maybeSingle();
  if(error||!data)return nf('Repo bulunamadı.');
  if(data.owner_email!==user.email)return nf('Bu repo sana ait değil.');
  R=data;drawRepo();
}
function drawRepo(){
  const link=i=>i.type==='site'?'#/newsite/'+i.ref:i.type==='test'?`#/test/${R.repo_slug}/${i.id}`:sqlPath(i.ref);
  const lab={site:'HTML / Site · Deploy',test:'Test · JavaScript',sql:'SQL · PostgreSQL 5 MB'};
  $('#app').innerHTML=`<div class="flex-1 overflow-auto"><div class="max-w-4xl mx-auto p-6">
   <div class="flex flex-wrap items-center justify-between gap-3 mb-6"><div><h1 class="text-2xl font-bold">${esc(R.title)}</h1><div class="mono text-xs text-oc-blue">${esc(R.repo_slug)}</div></div><button class="btn btn-accent" onclick="openNewClass()">Yeni sınıf</button></div>
   ${R.items.length?R.items.map(i=>`<div class="flex items-center justify-between gap-3 bg-oc-panel border border-oc-border rounded-xl p-4 mb-3"><div class="min-w-0"><div class="font-semibold truncate">${esc(i.name)}</div><div class="text-xs text-slate-400">${lab[i.type]}</div></div><div class="flex gap-2"><a class="btn" href="${esc(link(i))}">Aç</a><button class="btn" onclick="rmItem('${esc(i.id)}')">Kaldır</button></div></div>`).join(''):'<div class="text-slate-400">Bu repo boş. "Yeni sınıf" ile başla.</div>'}</div></div>`;
}
function openNewClass(){
  modal(`<h2 class="text-xl font-bold mb-4">Yeni sınıf</h2>
  <button class="btn w-full mb-2 justify-start" onclick="addClass('site')">🌐 HTML / Site / Deploy</button>
  <button class="btn w-full mb-2 justify-start" onclick="addClass('test')">🧪 Tests · programlama (JavaScript çalıştırma)</button>
  <button class="btn w-full mb-4 justify-start" onclick="addClass('sql')">🐘 SQL · 5 MB ücretsiz PostgreSQL</button>
  <button class="btn" onclick="closeModal()">Vazgeç</button>`);
}
async function saveItems(){const {error}=await supabaseClient.from('repos').update({items:R.items,updated_at:new Date().toISOString()}).eq('repo_slug',R.repo_slug);if(error)throw error}
async function addClass(type){
  closeModal();
  const name=prompt('Sınıf adı:',{site:'sitem',test:'deneme',sql:'veritabanim'}[type]);if(!name)return;
  const it={id:rand(),type,name};
  try{
    if(type==='site')it.ref=slugify(name)+'-'+rand();
    if(type==='test')it.code='console.log("Merhaba Wenitor");\nconsole.log([1,2,3].map(x=>x*2));';
    if(type==='sql'){const {data,error}=await supabaseClient.rpc('sqlproj_create',{p_email:user.email,p_hash:user.h,p_title:name,p_repo:R.repo_slug});if(error)throw error;it.ref=data.project_id}
    R.items.push(it);await saveItems();
    location.hash=type==='site'?'#/newsite/'+it.ref:type==='test'?`#/test/${R.repo_slug}/${it.id}`:sqlPath(it.ref);
  }catch(e){toast(e.message||String(e),'err')}
}
async function rmItem(id){
  const it=R.items.find(i=>i.id===id);if(!it||!confirm(`"${it.name}" kaldırılsın mı?`))return;
  try{
    if(it.type==='sql'){const {error}=await supabaseClient.rpc('sqlproj_delete',{p_project:it.ref,p_email:user.email,p_hash:user.h});if(error)throw error}
    if(it.type==='site')await supabaseClient.from('deployed_sites').delete().eq('project_slug',it.ref).eq('user_email',user.email);
    R.items=R.items.filter(i=>i.id!==id);await saveItems();drawRepo();
  }catch(e){toast(e.message||String(e),'err')}
}

/* ---------- SQL editörü: /#/postrage/.../blob/s<16 rakam> ---------- */
function qUsage(n){$('#qbar').style.width=Math.min(100,n/52428.8)+'%';$('#qbar').style.background=n>4718592?'#e11d48':'#38bdf8';$('#qinfo').textContent=(n/1048576).toFixed(2)+' MB / 5 MB kullanıldı'+(Q.owner?'':' · salt okunur (genel anahtar)')}
async function openSql(id){
  if(!/^s\d{16}$/.test(id||''))return nf('Geçersiz SQL proje ID.');
  const {data,error}=await supabaseClient.rpc('sqlproj_get',{p_project:id,p_email:user?user.email:'',p_hash:user?user.h||'':''});
  if(error||!data)return nf(error?error.message:'SQL projesi bulunamadı.');
  Q=data;const own=!!Q.owner;
  $('#app').innerHTML=`<div class="flex flex-wrap items-center justify-between gap-2 px-3 py-2 bg-oc-panel border-b border-oc-border text-sm flex-none">
    <div class="min-w-0"><span class="font-semibold">${esc(Q.title)}</span> <span class="mono text-xs text-oc-blue break-all">${esc(id)}</span></div>
    <div class="flex flex-wrap gap-2"><button class="btn !py-1" onclick="cpApi()">API kopyala</button><button class="btn !py-1" onclick="cp(location.href,'Bağlantı')">Bağlantı kopyala</button><button class="btn !py-1" onclick="cp(SUPABASE_URL+'/rest/v1/rpc/sqlproj_run','URL')">URL kopyala</button><button class="btn !py-1" onclick="cp(Q.public_key,'Genel anahtar')">Genel anahtar</button>${own?'<button class="btn !py-1" onclick="cp(Q.secret_key,\'Gizli ana anahtar\')">Gizli anahtar</button><button class="btn !py-1" onclick="saveSql()">Kaydet</button>':''}<button class="btn btn-accent !py-1" onclick="runSql()">Çalıştır</button></div></div>
   <div class="h-1.5 bg-oc-bg flex-none"><div id="qbar" class="h-full" style="width:0"></div></div><div id="qinfo" class="text-xs text-slate-400 px-3 py-1 flex-none"></div>
   <div class="flex-1 min-h-0 flex flex-col md:flex-row">
    <textarea id="qsql" spellcheck="false" ${own?'':'readonly'} class="flex-1 min-h-0 bg-oc-bg p-3 mono text-[13px] leading-5 outline-none resize-none">${esc(Q.script)}</textarea>
    <div id="qout" class="flex-1 min-h-0 overflow-auto border-t md:border-t-0 md:border-l border-oc-border p-3 text-sm bg-[#0b1222]"><span class="text-slate-500">Sonuçlar burada görünür. Ctrl+Enter ile çalıştır. Her ifade ";" ve satır sonu ile bitmeli.</span></div></div>`;
  qUsage(Q.size_bytes||0);
  $('#qsql').addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runSql()}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(Q.owner)saveSql()}
    if(e.key==='Tab'&&!e.target.readOnly){e.preventDefault();e.target.setRangeText('  ',e.target.selectionStart,e.target.selectionEnd,'end')}
  });
}
function cpApi(){cp(`curl -X POST '${SUPABASE_URL}/rest/v1/rpc/sqlproj_run' -H 'apikey: ${SUPABASE_ANON_KEY}' -H 'Content-Type: application/json' -d '{"p_project":"${Q.project_id}","p_key":"${Q.public_key}","p_sql":"select 1 as ok"}'`,'API (curl)')}
async function saveSql(){
  const {error}=await supabaseClient.rpc('sqlproj_save',{p_project:Q.project_id,p_email:user.email,p_hash:user.h,p_script:$('#qsql').value});
  error?toast(error.message,'err'):toast('SQL kaydedildi.','ok');
}
async function runSql(){
  const ta=$('#qsql'),sql=(ta.value.substring(ta.selectionStart,ta.selectionEnd)||ta.value).trim(),o=$('#qout');
  if(!sql)return;o.innerHTML='<span class="text-slate-400">Çalışıyor…</span>';
  const {data,error}=await supabaseClient.rpc('sqlproj_run',{p_project:Q.project_id,p_key:Q.secret_key||Q.public_key,p_sql:sql});
  if(error){o.innerHTML='<pre class="text-oc-accent whitespace-pre-wrap">'+esc(error.message)+'</pre>';return}
  qUsage(data.size_bytes);
  const cell=v=>esc(v!==null&&typeof v==='object'?JSON.stringify(v):v);
  o.innerHTML=data.results.map(r=>{
    if(!r.rows)return `<div class="mb-4"><div class="mono text-xs text-slate-500">${esc(r.sql)}</div><span class="text-green-400">${r.rowcount} satır etkilendi</span></div>`;
    const c=r.rows[0]?Object.keys(r.rows[0]):[];
    return `<div class="mb-4"><div class="mono text-xs text-slate-500 mb-1">${esc(r.sql)}</div>${r.rows.length?`<div class="overflow-auto"><table class="w-full text-left mono text-xs"><thead><tr>${c.map(k=>`<th class="p-1.5 border-b border-oc-border text-oc-blue">${esc(k)}</th>`).join('')}</tr></thead><tbody>${r.rows.map(x=>`<tr>${c.map(k=>`<td class="p-1.5 border-b border-oc-border/40">${cell(x[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<span class="text-slate-500">0 satır</span>'}</div>`;
  }).join('');
}

/* ---------- Test sınıfı: JavaScript çalıştırıcı ---------- */
async function openTest(rs,iid){
  if(!need())return;
  const {data}=await supabaseClient.from('repos').select('*').eq('repo_slug',rs).maybeSingle();
  const it=data&&data.items.find(i=>i.id===iid);
  if(!it||data.owner_email!==user.email)return nf('Test sınıfı bulunamadı.');
  T={row:data,it};
  $('#app').innerHTML=`<div class="flex items-center justify-between px-3 py-2 bg-oc-panel border-b border-oc-border text-sm flex-none"><div><span class="font-semibold">${esc(it.name)}</span> <span class="text-slate-400">JavaScript</span></div><div class="flex gap-2"><a class="btn !py-1" href="#/repo/${esc(rs)}">Repo</a><button class="btn !py-1" onclick="saveTest()">Kaydet</button><button class="btn btn-accent !py-1" onclick="runTest()">Çalıştır</button></div></div>
  <div class="flex-1 min-h-0 flex flex-col md:flex-row"><textarea id="tcode" spellcheck="false" class="flex-1 min-h-0 bg-oc-bg p-3 mono text-[13px] leading-5 outline-none resize-none">${esc(it.code||'')}</textarea>
  <pre id="tout" class="flex-1 min-h-0 overflow-auto border-t md:border-t-0 md:border-l border-oc-border p-3 text-sm mono bg-[#0b1222] whitespace-pre-wrap"></pre></div>
  <iframe id="tframe" class="hidden" sandbox="allow-scripts"></iframe>`;
  $('#tcode').addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();runTest()}
    if(e.key==='Tab'){e.preventDefault();e.target.setRangeText('  ',e.target.selectionStart,e.target.selectionEnd,'end')}
  });
}
window.addEventListener('message',e=>{
  const d=e.data,o=$('#tout');if(!d||!d.wen||!o)return;
  const s=document.createElement('div');s.textContent=d.m;if(d.t==='err')s.style.color='#fb7185';o.appendChild(s);
});
function runTest(){
  $('#tout').textContent='';
  const code=JSON.stringify($('#tcode').value).replace(/</g,'\\u003c');
  $('#tframe').srcdoc=`<script>const _p=(t,a)=>parent.postMessage({wen:1,t,m:a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch{return String(x)}}).join(' ')},'*');console.log=(...a)=>_p('log',a);console.error=(...a)=>_p('err',a);addEventListener('error',e=>_p('err',[e.message]));addEventListener('unhandledrejection',e=>_p('err',[e.reason]));try{(0,eval)(${code})}catch(e){_p('err',[e.message])}<\/script>`;
}
async function saveTest(){
  T.it.code=$('#tcode').value;
  const {error}=await supabaseClient.from('repos').update({items:T.row.items,updated_at:new Date().toISOString()}).eq('repo_slug',T.row.repo_slug);
  error?toast(error.message,'err'):toast('Kaydedildi.','ok');
}
</script>
